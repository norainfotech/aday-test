function idb(){return new Promise(function(ok,no){var r=indexedDB.open('nora-admin',1);r.onupgradeneeded=function(){r.result.createObjectStore('h')};r.onsuccess=function(){ok(r.result)};r.onerror=no})}

var SYNCING=false;

async function folderSync(manual){
 if(SYNCING||!window.showDirectoryPicker)return;SYNCING=true;var m=$('fsm');
 try{
  var h=null;try{h=await idbGet('dir')}catch(e){}
  if(h){var p=await h.queryPermission({mode:'read'});if(p!=='granted'){if(!manual){fst('🔒','Klasör izni bekliyor: "Klasörden ekle"ye bas','#d97706');return}p=await h.requestPermission({mode:'read'});if(p!=='granted')h=null}}
  else if(!manual)return;
  if(!h){h=await window.showDirectoryPicker({mode:'read'});await idbSet('dir',h)}
  fst('⟳','Klasör taranıyor…');m.textContent='';
  var have={};CVS.forEach(function(c){if(c.file_name)have[c.file_name.toLowerCase()]=1});
  var todo=[],skip=[];
  for await(var e of h.values()){if(e.kind!=='file')continue;if(have[e.name.toLowerCase()])continue;if(/\.(pdf|docx)$/i.test(e.name))todo.push(e);else skip.push(e.name)}
  if(!todo.length){fst('✓','Klasördeki tüm CV\'ler listede ('+h.name+')'+(skip.length?'. Atlanan: '+skip.join(', '):''),'#1a8f4c');return}
  var files=[];for(var i=0;i<todo.length;i++)files.push(await todo[i].getFile());
  qadd(files);fst('+'+files.length,files.length+' yeni CV sıraya alındı ('+h.name+'): "Ekle"ye bas','#d97706');
 }catch(e){if(e&&e.name!=='AbortError')m.textContent='Klasör okunamadı: '+(e.message||e)}
 finally{SYNCING=false}}
$('fsync').onclick=function(){if(!window.showDirectoryPicker){$('fsm').textContent='Bu tarayıcı klasör erişimini desteklemiyor; Chrome veya Edge kullan.';return}folderSync(true)};
